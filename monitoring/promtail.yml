server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gemma_api
    static_configs:
      - targets:
          - localhost
        labels:
          job: gemma_api
          __path__: /var/log/gemma/api.log
    pipeline_stages:
      - regex:
          expression: '.*endpoint=(?P<endpoint>\S+) status=(?P<status>\S+) inference_duration=(?P<inference_duration>[0-9.]+)'
      - labels:
          endpoint:
          status:
      - metrics:
          inference_duration_seconds:
            type: Gauge
            description: "Inference duration from logs"
            source: inference_duration
            config:
              action: set
